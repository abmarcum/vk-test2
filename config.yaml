server:
  http_addr: ":8080"
  https_addr: ":8443"
  enable_tls: false
  shutdown_grace_seconds: 15
  tls:
    cert_file: "certs/server.crt"
    key_file: "certs/server.key"
    min_version: "1.2"
  timeouts:
    read_header: "5s"
    read: "15s"
    write: "15s"
    idle: "60s"

routes:
  - match: "/"
    pool: "web_pool"

pools:
  - name: "web_pool"
    strategy: "round_robin"
    backends:
      - url: "http://127.0.0.1:8000"
    health_check:
      enabled: false
      path: "/healthz"
      interval: "10s"
      timeout: "2s"
      unhealthy_threshold: 3
      healthy_threshold: 2
