apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-http-server
  namespace: default
  labels:
    app: simple-http-server
    tier: edge
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: simple-http-server
  template:
    metadata:
      labels:
        app: simple-http-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: simple-http-server
          image: gcr.io/PROJECT_ID/simple-http-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/app/config/config.yaml"
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: TLS_CERT_PATH
              value: "/etc/tls/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/tls/tls.key"
            - name: PROXY_UPSTREAMS
              valueFrom:
                configMapKeyRef:
                  name: simple-http-server-config
                  key: proxy_upstreams
            - name: LB_STRATEGY
              valueFrom:
                configMapKeyRef:
                  name: simple-http-server-config
                  key: lb_strategy
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls-certs
          secret:
            secretName: http-server-tls
        - name: config-volume
          configMap:
            name: simple-http-server-config
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["simple-http-server"]
                topologyKey: "kubernetes.io/hostname"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-http-server-config
  namespace: default
data:
  proxy_upstreams: "backend-a.default.svc.cluster.local:9001,backend-b.default.svc.cluster.local:9002"
  lb_strategy: "round_robin"
  config.yaml: |
    server:
      httpAddr: ":8080"
      httpsAddr: ":8443"
    proxy:
      strategy: round_robin
      healthCheckInterval: 10s
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simple-http-server-pdb
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: simple-http-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-http-server-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-http-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
```

---
