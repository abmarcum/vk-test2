apiVersion: v1
kind: ConfigMap
metadata:
  name: http-server-config
  namespace: default
  labels:
    app: http-server
data:
  server.yaml: |
    listen:
      http: ":8080"
      https: ":8443"
    tls:
      certFile: /etc/tls/tls.crt
      keyFile: /etc/tls/tls.key
    loadBalancer:
      strategy: round_robin
      upstreams:
        - http://backend-1.default.svc.cluster.local
        - http://backend-2.default.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: default
  labels:
    app: http-server
    tier: edge
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
        tier: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: http-server-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["http-server"]
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: http-server
          image: us-docker.pkg.dev/PROJECT_ID/simple-http-server/simple-http-server:latest
          imagePullPolicy: Always
          args: ["-config", "/app/config/server.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: LB_STRATEGY
              value: "round_robin"
          envFrom:
            - secretRef:
                name: http-server-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: http-server-config
        - name: tls-certs
          secret:
            secretName: http-server-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: http-server-sa
  namespace: default
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: http-server-pdb
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: http-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: http-server-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: http-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
