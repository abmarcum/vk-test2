apiVersion: v1
kind: Namespace
metadata:
  name: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-http-server
  namespace: simple-http-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-http-server-config
  namespace: simple-http-server
data:
  config.yaml: |
    server:
      httpAddr: ":8080"
      httpsAddr: ":8443"
      metricsAddr: ":9090"
      readTimeout: 15s
      writeTimeout: 15s
      idleTimeout: 60s
    tls:
      certFile: /etc/tls/tls.crt
      keyFile: /etc/tls/tls.key
      minVersion: "1.2"
    proxy:
      upstreams:
        - name: backend-a
          url: http://backend-a.simple-http-server.svc.cluster.local:80
        - name: backend-b
          url: http://backend-b.simple-http-server.svc.cluster.local:80
      loadBalancing: round_robin
      healthCheckInterval: 10s
      healthCheckPath: /healthz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
    app.kubernetes.io/component: edge-proxy
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-http-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-http-server
        app.kubernetes.io/component: edge-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: simple-http-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http-server
          image: us-docker.pkg.dev/PROJECT_ID/simple-http-server/http-server:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/config/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          env:
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: simple-http-server-config
        - name: tls-certs
          secret:
            secretName: simple-http-server-tls
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: simple-http-server
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: simple-http-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-http-server
  namespace: simple-http-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-http-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simple-http-server
  namespace: simple-http-server
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-http-server
