apiVersion: v1
kind: Namespace
metadata:
  name: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-http-server
  namespace: simple-http-server
  annotations:
    iam.gke.io/gcp-service-account: simple-http-server@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-http-server-config
  namespace: simple-http-server
data:
  config.yaml: |
    server:
      http_addr: ":8080"
      https_addr: ":8443"
      read_timeout: 15s
      write_timeout: 15s
      idle_timeout: 60s
    proxy:
      upstream: "http://backend-service.default.svc.cluster.local:80"
      strategy: "round_robin"
    logging:
      level: "info"
      format: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
    app.kubernetes.io/component: edge-proxy
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-http-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-http-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: simple-http-server
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: simple-http-server
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: simple-http-server
      containers:
        - name: simple-http-server
          image: gcr.io/PROJECT_ID/simple-http-server:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/app/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: TLS_CERT_FILE
              value: /etc/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/tls/tls.key
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/app
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: simple-http-server-config
        - name: tls-certs
          secret:
            secretName: simple-http-server-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simple-http-server-pdb
  namespace: simple-http-server
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-http-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-http-server-hpa
  namespace: simple-http-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-http-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
