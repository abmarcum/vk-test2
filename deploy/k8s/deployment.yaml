apiVersion: v1
kind: Namespace
metadata:
  name: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-http-server-config
  namespace: simple-http-server
data:
  config.yaml: |
    server:
      httpPort: 8080
      httpsPort: 8443
      readTimeout: 15s
      writeTimeout: 15s
      idleTimeout: 60s
    loadBalancer:
      strategy: round_robin
      upstreams:
        - name: backend-a
          url: http://backend-a.simple-http-server.svc.cluster.local:5678
        - name: backend-b
          url: http://backend-b.simple-http-server.svc.cluster.local:5678
    proxy:
      enableXForwardedFor: true
      trustProxyHeaders: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app: simple-http-server
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: simple-http-server
  template:
    metadata:
      labels:
        app: simple-http-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: simple-http-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: simple-http-server
          image: us-docker.pkg.dev/PROJECT_ID/simple-http-server-repo/simple-http-server:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            - name: SERVER_LOG_LEVEL
              value: "info"
            - name: SERVER_TLS_CERT
              value: "/etc/tls/tls.crt"
            - name: SERVER_TLS_KEY
              value: "/etc/tls/tls.key"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: simple-http-server-config
        - name: tls-certs
          secret:
            secretName: simple-http-server-tls
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: simple-http-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-http-server
  namespace: simple-http-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simple-http-server-pdb
  namespace: simple-http-server
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: simple-http-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-http-server-hpa
  namespace: simple-http-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-http-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
