apiVersion: v1
kind: Namespace
metadata:
  name: simple-http-server
  labels:
    app.kubernetes.io/part-of: simple-http-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: http-server-config
  namespace: simple-http-server
data:
  log_level: "info"
  config.yaml: |
    server:
      http_addr: ":8080"
      https_addr: ":8443"
    tls:
      cert_file: /etc/tls/tls.crt
      key_file: /etc/tls/tls.key
    proxy:
      backends:
        - http://backend-a.simple-http-server.svc.cluster.local:9000
        - http://backend-b.simple-http-server.svc.cluster.local:9000
      strategy: round_robin
      health_check_path: /healthz
      health_check_interval: 10s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app: simple-http-server
    app.kubernetes.io/name: simple-http-server
    app.kubernetes.io/part-of: simple-http-server
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: simple-http-server
  template:
    metadata:
      labels:
        app: simple-http-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: simple-http-server
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: simple-http-server
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: simple-http-server
      containers:
        - name: http-server
          image: gcr.io/PROJECT_ID/simple-http-server:latest
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/http-server/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: http-server-config
                  key: log_level
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/http-server
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: http-server-config
        - name: tls-certs
          secret:
            secretName: http-server-tls
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        - name: gcr-json-key
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simple-http-server-pdb
  namespace: simple-http-server
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: simple-http-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-http-server-hpa
  namespace: simple-http-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-http-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
