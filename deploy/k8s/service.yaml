# Namespace, ServiceAccount, internal ClusterIP service, and external
# GCP Network LoadBalancer service exposing HTTP/HTTPS.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-http-server
  namespace: simple-http-server
---
apiVersion: v1
kind: Service
metadata:
  name: simple-http-server-internal
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: simple-http-server-external
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
  annotations:
    cloud.google.com/l4-rbs: "enabled"
    cloud.google.com/neg: '{"ingress": true}'
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: ""   # set to a reserved static IP name/address if using Terraform-managed IP
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
```

## deploy/terraform/main.tf

```hcl
# =============================================================================
# deploy/terraform/main.tf
# GCP infrastructure for Simple HTTP Server: GKE cluster, Artifact Registry,
# networking, static IP, firewall rules, and Cloud DNS record.
# =============================================================================

terraform {
  required_version = ">= 1.6.0"

  required_providers {
    google = {
      source  = "hashicorp/google"
      version = "~> 5.30"
    }
    google-beta = {
      source  = "hashicorp/google-beta"
      version = "~> 5.30"
    }
  }

  backend "gcs" {
    bucket = "simple-http-server-tfstate"
    prefix = "terraform/state"
  }
}

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
variable "project_id" {
  description = "GCP project ID"
  type        = string
}

variable "region" {
  description = "Primary GCP region"
  type        = string
  default     = "us-central1"
}

variable "zone" {
  description = "Primary GCP zone"
  type        = string
  default     = "us-central1-a"
}

variable "cluster_name" {
  description = "GKE cluster name"
  type        = string
  default     = "simple-http-server-cluster"
}

variable "node_machine_type" {
  description = "Machine type for GKE nodes"
  type        = string
  default     = "e2-standard-2"
}

variable "node_count" {
  description = "Initial node count per zone"
  type        = number
  default     = 3
}

variable "min_node_count" {
  type    = number
  default = 3
}

variable "max_node_count" {
  type    = number
  default = 10
}

variable "dns_managed_zone" {
  description = "Cloud DNS managed zone name (optional, leave empty to skip DNS record)"
  type        = string
  default     = ""
}

variable "dns_record_name" {
  description = "FQDN for the A record, e.g. http-server.example.com."
  type        = string
  default     = ""
}

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------
provider "google" {
  project = var.project_id
  region  = var.region
}

provider "google-beta" {
  project = var.project_id
  region  = var.region
}

# ---------------------------------------------------------------------------
# APIs
# ---------------------------------------------------------------------------
resource "google_project_service" "required" {
  for_each = toset([
    "container.googleapis.com",
    "artifactregistry.googleapis.com",
    "compute.googleapis.com",
    "dns.googleapis.com",
    "monitoring.googleapis.com",
    "logging.googleapis.com",
  ])
  project            = var.project_id
  service            = each.value
  disable_on_destroy = false
}

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
resource "google_compute_network" "vpc" {
  name                    = "simple-http-server-vpc"
  auto_create_subnetworks = false
  depends_on              = [google_project_service.required]
}

resource "google_compute_subnetwork" "subnet" {
  name                     = "simple-http-server-subnet"
  ip_cidr_range            = "10.10.0.0/20"
  region                   = var.region
  network                  = google_compute_network.vpc.id
  private_ip_google_access = true

  secondary_ip_range {
    range_name    = "pods"
    ip_cidr_range = "10.20.0.0/16"
  }

  secondary_ip_range {
    range_name    = "services"
    ip_cidr_range = "10.30.0.0/20"
  }
}

resource "google_compute_firewall" "allow_health_checks" {
  name    = "allow-gcp-health-checks"
  network = google_compute_network.vpc.name

  allow {
    protocol = "tcp"
    ports    = ["8080", "8443", "9090"]
  }

  # GCP health check source ranges
  source_ranges = ["130.211.0.0/22", "35.191.0.0/16"]
  target_tags   = ["gke-node"]
}

resource "google_compute_firewall" "allow_internal" {
  name    = "allow-internal-traffic"
  network = google_compute_network.vpc.name

  allow {
    protocol = "tcp"
    ports    = ["0-65535"]
  }
  allow {
    protocol = "udp"
    ports    = ["0-65535"]
  }
  allow {
    protocol = "icmp"
  }

  source_ranges = ["10.10.0.0/20", "10.20.0.0/16", "10.30.0.0/20"]
}

# Static external IP for the Kubernetes LoadBalancer Service
resource "google_compute_address" "http_server_ip" {
  name         = "simple-http-server-ip"
  region       = var.region
  address_type = "EXTERNAL"
}

# ---------------------------------------------------------------------------
# Artifact Registry
# ---------------------------------------------------------------------------
resource "google_artifact_registry_repository" "repo" {
  location      = var.region
  repository_id = "simple-http-server"
  description   = "Container images for Simple HTTP Server"
  format        = "DOCKER"

  cleanup_policies {
    id     = "keep-last-10"
    action = "KEEP"
    most_recent_versions {
      keep_count = 10
    }
  }

  depends_on = [google_project_service.required]
}

# ---------------------------------------------------------------------------
# GKE Cluster (regional, private nodes, VPC-native)
# ---------------------------------------------------------------------------
resource "google_container_cluster" "primary" {
  name     = var.cluster_name
  location = var.region
  project  = var.project_id

  network    = google_compute_network.vpc.id
  subnetwork = google_compute_subnetwork.subnet.id

  # Manage node pools separately
  remove_default_node_pool = true
  initial_node_count       = 1

  networking_mode = "VPC_NATIVE"
  ip_allocation_policy {
    cluster_secondary_range_name  = "pods"
    services_secondary_range_name = "services"
  }

  private_cluster_config {
    enable_private_nodes    = true
    enable_private_endpoint = false
    master_ipv4_cidr_block  = "172.16.0.0/28"
  }

  master_authorized_networks_config {
    cidr_blocks {
      cidr_block   = "0.0.0.0/0"
      display_name = "all (restrict in production)"
    }
  }

  release_channel {
    channel = "REGULAR"
  }

  workload_identity_config {
    workload_pool = "${var.project_id}.svc.id.goog"
  }

  addons_config {
    horizontal_pod_autoscaling {
      disabled = false
    }
    http_load_balancing {
      disabled = false
    }
  }

  maintenance_policy {
    daily_maintenance_window {
      start_time = "03:00"
    }
  }

  deletion_protection = false

  depends_on = [google_project_service.required]
}

resource "google_container_node_pool" "primary_nodes" {
  name     = "${var.cluster_name}-node-pool"
  location = var.region
  cluster  = google_container_cluster.primary.name

  node_count = var.node_count

  autoscaling {
    min_node_count = var.min_node_count
    max_node_count = var.max_node_count
  }

  management {
    auto_repair  = true
    auto_upgrade = true
  }

  node_config {
    machine_type = var.node_machine_type
    tags         = ["gke-node", "simple-http-server"]

    workload_metadata_config {
      mode = "GKE_METADATA"
    }

    shielded_instance_config {
      enable_secure_boot          = true
      enable_integrity_monitoring = true
    }

    oauth_scopes = [
      "https://www.googleapis.com/auth/cloud-platform",
    ]

    labels = {
      app = "simple-http-server"
    }
  }

  upgrade_settings {
    max_surge       = 1
    max_unavailable = 0
  }
}

# ---------------------------------------------------------------------------
# IAM: Workload Identity binding for in-cluster ServiceAccount
# ---------------------------------------------------------------------------
resource "google_service_account" "workload_sa" {
  account_id   = "simple-http-server-sa"
  display_name = "Simple HTTP Server Workload Identity SA"
}

resource "google_service_account_iam_binding" "workload_identity_binding" {
  service_account_id = google_service_account.workload_sa.name
  role                = "roles/iam.workloadIdentityUser"
  members = [
    "serviceAccount:${var.project_id}.svc.id.goog[simple-http-server/simple-http-server]",
  ]
}

# ---------------------------------------------------------------------------
# Optional Cloud DNS record pointing to the static IP
# ---------------------------------------------------------------------------
resource "google_dns_record_set" "http_server_a" {
  count        = var.dns_managed_zone != "" && var.dns_record_name != "" ? 1 : 0
  name         = var.dns_record_name
  type         = "A"
  ttl          = 300
  managed_zone = var.dns_managed_zone
  rrdatas      = [google_compute_address.http_server_ip.address]
}

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
output "cluster_name" {
  value = google_container_cluster.primary.name
}

output "cluster_endpoint" {
  value     = google_container_cluster.primary.endpoint
  sensitive = true
}

output "artifact_registry_url" {
  value = "${var.region}-docker.pkg.dev/${var.project_id}/${google_artifact_registry_repository.repo.repository_id}"
}

output "static_ip_address" {
  value = google_compute_address.http_server_ip.address
}

output "workload_identity_service_account" {
  value = google_service_account.workload_sa.email
}
