apiVersion: v1
kind: Service
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app: simple-http-server
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "http-server-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: http-server-backendconfig
  namespace: simple-http-server
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
  securityPolicy:
    name: "http-server-armor-policy"
  sessionAffinity:
    affinityType: "CLIENT_IP"
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: http-server-managed-cert
  namespace: simple-http-server
spec:
  domains:
    - example.com
    - www.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-http-server-ingress
  namespace: simple-http-server
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "http-server-static-ip"
    networking.gke.io/managed-certificates: "http-server-managed-cert"
    kubernetes.io/ingress.allow-http: "true"
spec:
  defaultBackend:
    service:
      name: simple-http-server
      port:
        number: 80
  rules:
    - host: example.com
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: simple-http-server
                port:
                  number: 80
