# Internal ClusterIP service + external GCP L4 Load Balancer service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: simple-http-server-external
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
  annotations:
    # Regional external passthrough Network Load Balancer on GKE
    cloud.google.com/neg: '{"exposed_ports": {"80":{},"443":{}}}'
    networking.gke.io/load-balancer-type: "External"
    cloud.google.com/l4-rbs: "enabled"
    # Bind to a reserved static IP created by Terraform (see main.tf)
    networking.gke.io/internal-load-balancer-allow-global-access: "false"
spec:
  type: LoadBalancer
  loadBalancerIP: STATIC_LB_IP_ADDRESS
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
