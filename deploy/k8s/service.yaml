## deploy/terraform/main.tf

```hcl
###############################################################################
# Simple HTTP Server - GCP Infrastructure
# GKE + Artifact Registry + Global HTTPS Load Balancing + Managed SSL
###############################################################################

terraform {
  required_version = ">= 1.5.0"

  required_providers {
    google      = { source = "hashicorp/google",      version = "~> 5.10" }
    google-beta = { source = "hashicorp/google-beta", version = "~> 5.10" }
  }

  backend "gcs" {
    bucket = "REPLACE_WITH_YOUR_TF_STATE_BUCKET"
    prefix = "simple-http-server/state"
  }
}

###############################################################################
# Variables
###############################################################################

variable "project_id" {
  description = "GCP project ID"
  type        = string
}

variable "region" {
  description = "GCP region"
  type        = string
  default     = "us-central1"
}

variable "zone" {
  description = "GCP zone"
  type        = string
  default     = "us-central1-a"
}

variable "environment" {
  description = "Deployment environment"
  type        = string
  default     = "prod"
}

variable "app_name" {
  description = "Application name"
  type        = string
  default     = "simple-http-server"
}

variable "domain_name" {
  description = "Public domain name served by the load balancer (managed SSL cert)"
  type        = string
  default     = "example.com"
}

variable "gke_node_count" {
  description = "Number of nodes per zone in the GKE node pool"
  type        = number
  default     = 2
}

variable "gke_machine_type" {
  description = "GKE node machine type"
  type        = string
  default     = "e2-standard-2"
}

###############################################################################
# Providers
###############################################################################

provider "google" {
  project = var.project_id
  region  = var.region
}

provider "google-beta" {
  project = var.project_id
  region  = var.region
}

###############################################################################
# APIs
###############################################################################

resource "google_project_service" "apis" {
  for_each = toset([
    "compute.googleapis.com",
    "container.googleapis.com",
    "artifactregistry.googleapis.com",
    "dns.googleapis.com",
    "iam.googleapis.com",
    "cloudresourcemanager.googleapis.com",
  ])
  project            = var.project_id
  service            = each.value
  disable_on_destroy = false
}

###############################################################################
# Networking
###############################################################################

resource "google_compute_network" "vpc" {
  name                    = "${var.app_name}-vpc"
  auto_create_subnetworks = false
  depends_on              = [google_project_service.apis]
}

resource "google_compute_subnetwork" "subnet" {
  name          = "${var.app_name}-subnet"
  ip_cidr_range = "10.10.0.0/20"
  region        = var.region
  network       = google_compute_network.vpc.id

  secondary_ip_range {
    range_name    = "gke-pods"
    ip_cidr_range = "10.20.0.0/16"
  }
  secondary_ip_range {
    range_name    = "gke-services"
    ip_cidr_range = "10.30.0.0/20"
  }
}

resource "google_compute_firewall" "allow_health_checks" {
  name    = "${var.app_name}-allow-lb-health-checks"
  network = google_compute_network.vpc.id

  allow {
    protocol = "tcp"
    ports    = ["8080", "8443"]
  }

  # Google Cloud LB health check ranges
  source_ranges = ["130.211.0.0/22", "35.191.0.0/16"]
  target_tags   = ["${var.app_name}-node"]
}

###############################################################################
# Artifact Registry
###############################################################################

resource "google_artifact_registry_repository" "repo" {
  location      = var.region
  repository_id = "${var.app_name}-repo"
  description   = "Container images for ${var.app_name}"
  format        = "DOCKER"
  depends_on    = [google_project_service.apis]
}

###############################################################################
# GKE Cluster (regional, private nodes, workload identity)
###############################################################################

resource "google_service_account" "gke_nodes" {
  account_id   = "${var.app_name}-gke-node"
  display_name = "GKE node SA for ${var.app_name}"
}

resource "google_service_account" "workload" {
  account_id   = var.app_name
  display_name = "Workload identity SA for ${var.app_name}"
}

resource "google_project_iam_member" "gke_node_roles" {
  for_each = toset([
    "roles/logging.logWriter",
    "roles/monitoring.metricWriter",
    "roles/monitoring.viewer",
    "roles/artifactregistry.reader",
  ])
  project = var.project_id
  role    = each.value
  member  = "serviceAccount:${google_service_account.gke_nodes.email}"
}

resource "google_container_cluster" "primary" {
  name     = "${var.app_name}-cluster"
  location = var.region

  remove_default_node_pool = true
  initial_node_count       = 1

  network    = google_compute_network.vpc.id
  subnetwork = google_compute_subnetwork.subnet.id

  ip_allocation_policy {
    cluster_secondary_range_name  = "gke-pods"
    services_secondary_range_name = "gke-services"
  }

  private_cluster_config {
    enable_private_nodes    = true
    enable_private_endpoint = false
    master_ipv4_cidr_block  = "172.16.0.0/28"
  }

  workload_identity_config {
    workload_pool = "${var.project_id}.svc.id.goog"
  }

  release_channel {
    channel = "REGULAR"
  }

  master_authorized_networks_config {
    cidr_blocks {
      cidr_block   = "0.0.0.0/0" # restrict to office/VPN CIDR in production
      display_name = "all"
    }
  }

  depends_on = [google_project_service.apis]
}

resource "google_container_node_pool" "default" {
  name       = "${var.app_name}-node-pool"
  location   = var.region
  cluster    = google_container_cluster.primary.name
  node_count = var.gke_node_count

  autoscaling {
    min_node_count = 2
    max_node_count = 6
  }

  management {
    auto_repair  = true
    auto_upgrade = true
  }

  node_config {
    machine_type    = var.gke_machine_type
    tags            = ["${var.app_name}-node"]
    service_account = google_service_account.gke_nodes.email

    oauth_scopes = [
      "https://www.googleapis.com/auth/cloud-platform",
    ]

    workload_metadata_config {
      mode = "GKE_METADATA"
    }

    labels = {
      app         = var.app_name
      environment = var.environment
    }

    shielded_instance_config {
      enable_secure_boot          = true
      enable_integrity_monitoring = true
    }
  }
}

resource "google_service_account_iam_member" "workload_identity_binding" {
  service_account_id = google_service_account.workload.name
  role                = "roles/iam.workloadIdentityUser"
  member              = "serviceAccount:${var.project_id}.svc.id.goog[simple-http-server/simple-http-server]"
}

###############################################################################
# Global external HTTPS Load Balancer components
# (Static IP + Managed SSL cert + DNS record; GKE Ingress/Service consumes these)
###############################################################################

resource "google_compute_global_address" "lb_ip" {
  name = "${var.app_name}-lb-ip"
}

resource "google_compute_managed_ssl_certificate" "cert" {
  name = "${var.app_name}-managed-cert"

  managed {
    domains = [var.domain_name]
  }
}

resource "google_dns_managed_zone" "zone" {
  count       = var.domain_name != "" ? 1 : 0
  name        = "${replace(var.app_name, "_", "-")}-zone"
  dns_name    = "${var.domain_name}."
  description = "DNS zone for ${var.app_name}"
}

resource "google_dns_record_set" "a_record" {
  count        = var.domain_name != "" ? 1 : 0
  name         = "${var.domain_name}."
  managed_zone = google_dns_managed_zone.zone[0].name
  type         = "A"
  ttl          = 300
  rrdatas      = [google_compute_global_address.lb_ip.address]
}

###############################################################################
# Outputs
###############################################################################

output "gke_cluster_name" {
  value = google_container_cluster.primary.name
}

output "gke_cluster_endpoint" {
  value     = google_container_cluster.primary.endpoint
  sensitive = true
}

output "artifact_registry_repo" {
  value = "${var.region}-docker.pkg.dev/${var.project_id}/${google_artifact_registry_repository.repo.repository_id}"
}

output "load_balancer_ip" {
  value = google_compute_global_address.lb_ip.address
}

output "workload_identity_sa_email" {
  value = google_service_account.workload.email
}

output "managed_ssl_certificate" {
  value = google_compute_managed_ssl_certificate.cert.name
}
