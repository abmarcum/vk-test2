apiVersion: v1
kind: Service
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app: simple-http-server
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "simple-http-server-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: simple-http-server-backendconfig
  namespace: simple-http-server
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 30
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: simple-http-server-cert
  namespace: simple-http-server
spec:
  domains:
    - example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-http-server-ingress
  namespace: simple-http-server
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "simple-http-server-ip"
    networking.gke.io/managed-certificates: "simple-http-server-cert"
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: simple-http-server
                port:
                  number: 80
