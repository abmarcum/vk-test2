## deploy/terraform/main.tf

```hcl
##############################################################################
# Simple HTTP Server - GCP Infrastructure (GKE Autopilot + Artifact Registry)
##############################################################################

terraform {
  required_version = ">= 1.5.0"

  required_providers {
    google = {
      source  = "hashicorp/google"
      version = "~> 5.30"
    }
    google-beta = {
      source  = "hashicorp/google-beta"
      version = "~> 5.30"
    }
    kubernetes = {
      source  = "hashicorp/kubernetes"
      version = "~> 2.29"
    }
  }

  backend "gcs" {
    bucket = "REPLACE_WITH_TF_STATE_BUCKET"
    prefix = "simple-http-server/state"
  }
}

##############################################################################
# Variables
##############################################################################

variable "project_id" {
  description = "GCP project ID"
  type        = string
}

variable "region" {
  description = "GCP region for regional resources"
  type        = string
  default     = "us-central1"
}

variable "zone" {
  description = "GCP zone for zonal resources"
  type        = string
  default     = "us-central1-a"
}

variable "environment" {
  description = "Deployment environment (dev/staging/prod)"
  type        = string
  default     = "prod"
}

variable "app_name" {
  description = "Application name"
  type        = string
  default     = "simple-http-server"
}

variable "node_machine_type" {
  description = "Machine type for GKE nodes (standard mode; ignored in Autopilot)"
  type        = string
  default     = "e2-standard-2"
}

variable "min_node_count" {
  type    = number
  default = 1
}

variable "max_node_count" {
  type    = number
  default = 5
}

variable "domain" {
  description = "Domain used for the managed SSL certificate"
  type        = string
  default     = "example.com"
}

##############################################################################
# Providers
##############################################################################

provider "google" {
  project = var.project_id
  region  = var.region
}

provider "google-beta" {
  project = var.project_id
  region  = var.region
}

##############################################################################
# APIs
##############################################################################

resource "google_project_service" "required" {
  for_each = toset([
    "container.googleapis.com",
    "compute.googleapis.com",
    "artifactregistry.googleapis.com",
    "cloudresourcemanager.googleapis.com",
    "iam.googleapis.com",
    "certificatemanager.googleapis.com",
    "monitoring.googleapis.com",
    "logging.googleapis.com",
  ])

  project            = var.project_id
  service            = each.value
  disable_on_destroy = false
}

##############################################################################
# Networking
##############################################################################

resource "google_compute_network" "vpc" {
  name                    = "${var.app_name}-vpc"
  auto_create_subnetworks = false
  depends_on              = [google_project_service.required]
}

resource "google_compute_subnetwork" "subnet" {
  name          = "${var.app_name}-subnet"
  ip_cidr_range = "10.10.0.0/20"
  region        = var.region
  network       = google_compute_network.vpc.id

  secondary_ip_range {
    range_name    = "pods"
    ip_cidr_range = "10.20.0.0/14"
  }

  secondary_ip_range {
    range_name    = "services"
    ip_cidr_range = "10.30.0.0/20"
  }

  private_ip_google_access = true
}

resource "google_compute_router" "router" {
  name    = "${var.app_name}-router"
  region  = var.region
  network = google_compute_network.vpc.id
}

resource "google_compute_router_nat" "nat" {
  name                               = "${var.app_name}-nat"
  router                             = google_compute_router.router.name
  region                             = var.region
  nat_ip_allocate_option             = "AUTO_ONLY"
  source_subnetwork_ip_ranges_to_nat = "ALL_SUBNETWORKS_ALL_IP_RANGES"
}

# Reserved global static IP for the HTTPS Load Balancer / Ingress
resource "google_compute_global_address" "lb_ip" {
  name = "${var.app_name}-ip"
}

# Firewall: allow health checks from Google LB ranges
resource "google_compute_firewall" "allow_health_check" {
  name    = "${var.app_name}-allow-hc"
  network = google_compute_network.vpc.id

  allow {
    protocol = "tcp"
    ports    = ["8080", "8443"]
  }

  source_ranges = ["130.211.0.0/22", "35.191.0.0/16"]
  target_tags   = [var.app_name]
}

##############################################################################
# GKE Autopilot Cluster
##############################################################################

resource "google_container_cluster" "primary" {
  name     = "${var.app_name}-cluster"
  location = var.region

  enable_autopilot = true

  network    = google_compute_network.vpc.id
  subnetwork = google_compute_subnetwork.subnet.id

  ip_allocation_policy {
    cluster_secondary_range_name  = "pods"
    services_secondary_range_name = "services"
  }

  release_channel {
    channel = "REGULAR"
  }

  deletion_protection = true

  depends_on = [google_project_service.required]
}

##############################################################################
# Artifact Registry (container images)
##############################################################################

resource "google_artifact_registry_repository" "repo" {
  location      = var.region
  repository_id = "${var.app_name}-repo"
  description   = "Docker repository for ${var.app_name}"
  format        = "DOCKER"

  depends_on = [google_project_service.required]
}

##############################################################################
# IAM - Workload Identity for the application service account
##############################################################################

resource "google_service_account" "app_sa" {
  account_id   = "${var.app_name}-sa"
  display_name = "Service Account for ${var.app_name}"
}

resource "google_project_iam_member" "app_sa_monitoring" {
  project = var.project_id
  role    = "roles/monitoring.metricWriter"
  member  = "serviceAccount:${google_service_account.app_sa.email}"
}

resource "google_project_iam_member" "app_sa_logging" {
  project = var.project_id
  role    = "roles/logging.logWriter"
  member  = "serviceAccount:${google_service_account.app_sa.email}"
}

resource "google_service_account_iam_member" "workload_identity_binding" {
  service_account_id = google_service_account.app_sa.name
  role                = "roles/iam.workloadIdentityUser"
  member              = "serviceAccount:${var.project_id}.svc.id.goog[default/${var.app_name}]"
}

##############################################################################
# Managed SSL Certificate (for GCE Ingress)
##############################################################################

resource "google_compute_managed_ssl_certificate" "default" {
  name = "${var.app_name}-cert"

  managed {
    domains = [var.domain]
  }
}

##############################################################################
# Outputs
##############################################################################

output "cluster_name" {
  value = google_container_cluster.primary.name
}

output "cluster_endpoint" {
  value     = google_container_cluster.primary.endpoint
  sensitive = true
}

output "artifact_registry_url" {
  value = "${var.region}-docker.pkg.dev/${var.project_id}/${google_artifact_registry_repository.repo.repository_id}"
}

output "load_balancer_ip" {
  value = google_compute_global_address.lb_ip.address
}

output "app_service_account_email" {
  value = google_service_account.app_sa.email
}
```

---

### Notes for Operators
- Replace `PROJECT_ID`, `REPLACE_WITH_TF_STATE_BUCKET`, and `example.com` with real values before applying.
- `deploy/k8s/deployment.yaml` expects `simple-http-server-tls` Secret and `simple-http-server-config` ConfigMap to be provisioned separately (e.g., via `cert-manager` or `kubectl create secret tls`).
- The Ingress uses GCE's native load balancing (`kubernetes.io/ingress.class: gce`) to satisfy the "load balancing" requirement at the edge, while the Go app itself can also perform L7 proxying/LB to upstream services as per its design.
- Run `terraform plan` before `apply`; `deletion_protection = true` is set on the cluster to prevent accidental destroys in prod.
