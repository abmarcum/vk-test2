apiVersion: v1
kind: Service
metadata:
  name: simple-http-server-internal
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
# GCP-native external LoadBalancer (creates a Google Cloud Network/HTTP(S) LB)
apiVersion: v1
kind: Service
metadata:
  name: simple-http-server-external
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "simple-http-server-backendconfig"}'
    # Reserve and reference a static external IP created in Terraform
    # (replace with the actual IP name/address from terraform output)
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  loadBalancerIP: "" # set to terraform-managed static IP if using regional external LB
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: simple-http-server-backendconfig
  namespace: simple-http-server
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
  sessionAffinity:
    affinityType: "CLIENT_IP"
