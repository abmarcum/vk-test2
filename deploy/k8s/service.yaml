apiVersion: v1
kind: Service
metadata:
  name: simple-http-server
  namespace: default
  labels:
    app: simple-http-server
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "simple-http-server-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: simple-http-server-backendconfig
  namespace: default
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-http-server-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "simple-http-server-ip"
    networking.gke.io/managed-certificates: "simple-http-server-cert"
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - host: httpserver.example.com
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: simple-http-server
                port:
                  number: 443
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: simple-http-server-cert
  namespace: default
spec:
  domains:
    - httpserver.example.com
```

## deploy/terraform/main.tf

```hcl
terraform {
  required_version = ">= 1.5.0"

  required_providers {
    google = {
      source  = "hashicorp/google"
      version = "~> 5.30"
    }
    kubernetes = {
      source  = "hashicorp/kubernetes"
      version = "~> 2.29"
    }
  }

  backend "gcs" {
    bucket = "REPLACE_WITH_TF_STATE_BUCKET"
    prefix = "simple-http-server/state"
  }
}

#############################
# Variables
#############################
variable "project_id" {
  description = "GCP project ID"
  type        = string
}

variable "region" {
  description = "GCP region"
  type        = string
  default     = "us-central1"
}

variable "zone" {
  description = "GCP zone"
  type        = string
  default     = "us-central1-a"
}

variable "cluster_name" {
  description = "GKE cluster name"
  type        = string
  default     = "simple-http-server-cluster"
}

variable "node_count" {
  description = "Number of nodes per zone"
  type        = number
  default     = 3
}

variable "machine_type" {
  description = "GKE node machine type"
  type        = string
  default     = "e2-standard-2"
}

variable "image_repo" {
  description = "Artifact Registry repo name"
  type        = string
  default     = "simple-http-server-repo"
}

#############################
# Providers
#############################
provider "google" {
  project = var.project_id
  region  = var.region
  zone    = var.zone
}

data "google_client_config" "default" {}

#############################
# Networking
#############################
resource "google_compute_network" "vpc" {
  name                    = "simple-http-server-vpc"
  auto_create_subnetworks = false
}

resource "google_compute_subnetwork" "subnet" {
  name          = "simple-http-server-subnet"
  ip_cidr_range = "10.10.0.0/20"
  region        = var.region
  network       = google_compute_network.vpc.id

  secondary_ip_range {
    range_name    = "pods"
    ip_cidr_range = "10.20.0.0/16"
  }

  secondary_ip_range {
    range_name    = "services"
    ip_cidr_range = "10.30.0.0/20"
  }
}

resource "google_compute_global_address" "lb_ip" {
  name = "simple-http-server-ip"
}

#############################
# Artifact Registry
#############################
resource "google_artifact_registry_repository" "repo" {
  location      = var.region
  repository_id = var.image_repo
  format        = "DOCKER"
  description   = "Docker images for Simple HTTP Server"
}

#############################
# GKE Cluster
#############################
resource "google_service_account" "gke_sa" {
  account_id   = "simple-http-server-gke-sa"
  display_name = "GKE Node Service Account - Simple HTTP Server"
}

resource "google_project_iam_member" "gke_sa_roles" {
  for_each = toset([
    "roles/logging.logWriter",
    "roles/monitoring.metricWriter",
    "roles/monitoring.viewer",
    "roles/artifactregistry.reader",
  ])
  project = var.project_id
  role    = each.value
  member  = "serviceAccount:${google_service_account.gke_sa.email}"
}

resource "google_container_cluster" "primary" {
  name     = var.cluster_name
  location = var.zone
  project  = var.project_id

  network    = google_compute_network.vpc.id
  subnetwork = google_compute_subnetwork.subnet.id

  remove_default_node_pool = true
  initial_node_count       = 1

  ip_allocation_policy {
    cluster_secondary_range_name  = "pods"
    services_secondary_range_name = "services"
  }

  release_channel {
    channel = "REGULAR"
  }

  workload_identity_config {
    workload_pool = "${var.project_id}.svc.id.goog"
  }

  addons_config {
    http_load_balancing {
      disabled = false
    }
    horizontal_pod_autoscaling {
      disabled = false
    }
  }

  deletion_protection = false
}

resource "google_container_node_pool" "primary_nodes" {
  name       = "${var.cluster_name}-node-pool"
  location   = var.zone
  cluster    = google_container_cluster.primary.name
  node_count = var.node_count

  node_config {
    machine_type    = var.machine_type
    service_account = google_service_account.gke_sa.email
    oauth_scopes    = ["https://www.googleapis.com/auth/cloud-platform"]

    labels = {
      app = "simple-http-server"
    }

    tags = ["simple-http-server-node"]

    workload_metadata_config {
      mode = "GKE_METADATA"
    }
  }

  autoscaling {
    min_node_count = 2
    max_node_count = 6
  }

  management {
    auto_repair  = true
    auto_upgrade = true
  }
}

#############################
# Firewall Rules
#############################
resource "google_compute_firewall" "allow_lb_health_checks" {
  name    = "allow-lb-health-checks-httpserver"
  network = google_compute_network.vpc.id

  allow {
    protocol = "tcp"
    ports    = ["8080", "8443", "9090"]
  }

  source_ranges = ["130.211.0.0/22", "35.191.0.0/16"]
  target_tags   = ["simple-http-server-node"]
}

resource "google_compute_firewall" "allow_internal" {
  name    = "allow-internal-httpserver"
  network = google_compute_network.vpc.id

  allow {
    protocol = "tcp"
    ports    = ["0-65535"]
  }
  allow {
    protocol = "udp"
    ports    = ["0-65535"]
  }

  source_ranges = ["10.10.0.0/20", "10.20.0.0/16", "10.30.0.0/20"]
}

#############################
# Outputs
#############################
output "cluster_endpoint" {
  value       = google_container_cluster.primary.endpoint
  sensitive   = true
  description = "GKE cluster endpoint"
}

output "cluster_name" {
  value = google_container_cluster.primary.name
}

output "load_balancer_ip" {
  value       = google_compute_global_address.lb_ip.address
  description = "Static IP for the HTTP(S) Load Balancer / Ingress"
}

output "artifact_registry_repo" {
  value = google_artifact_registry_repository.repo.name
}
```

---

### Notes for operators
- Replace `PROJECT_ID`, `REPLACE_WITH_TF_STATE_BUCKET`, and `httpserver.example.com` with real values before applying.
- TLS certs for local/docker-compose runs should be placed in `./certs` (`tls.crt`, `tls.key`); in GKE, TLS is terminated at the Ingress via `ManagedCertificate`, or optionally at the pod level using the `simple-http-server-tls` Kubernetes Secret for end-to-end encryption.
- CI/CD should push images to `gcr.io/PROJECT_ID/simple-http-server` or the Artifact Registry repo created in Terraform, then update the Deployment image tag (recommend Kustomize or `kubectl set image` in the pipeline).
- The HPA and node pool autoscaler provide load-based horizontal scaling in front of the app-level load balancing performed by the Go server itself.
