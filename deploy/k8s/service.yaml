apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: simple-http-server-backendconfig
  namespace: simple-http-server
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 8080
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
  sessionAffinity:
    affinityType: "CLIENT_IP"
---
apiVersion: v1
kind: Service
metadata:
  name: simple-http-server
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
  annotations:
    cloud.google.com/backend-config: '{"default": "simple-http-server-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
    networking.gke.io/load-balancer-type: "External"
spec:
  type: LoadBalancer
  loadBalancerIP: "" # set to reserved static IP (google_compute_global_address) if using L4 LB directly
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: simple-http-server-internal
  namespace: simple-http-server
  labels:
    app.kubernetes.io/name: simple-http-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simple-http-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
