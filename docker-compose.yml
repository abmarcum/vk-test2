version: "3.9"

services:
  http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        COMMIT_SHA: local-dev
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
      - "9090:9090"   # Metrics
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      TLS_CERT_FILE: /app/certs/server.crt
      TLS_KEY_FILE: /app/certs/server.key
      UPSTREAM_BACKENDS: "backend-a:9001,backend-b:9002"
      LB_STRATEGY: round_robin
    volumes:
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
    depends_on:
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/app/httpserver", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Demo upstream target #1 for reverse-proxy / load-balancing
  backend-a:
    image: hashicorp/http-echo:1.0
    container_name: backend-a
    command: ["-text=response from backend-a", "-listen=:9001"]
    networks:
      - edge

  # Demo upstream target #2 for reverse-proxy / load-balancing
  backend-b:
    image: hashicorp/http-echo:1.0
    container_name: backend-b
    command: ["-text=response from backend-b", "-listen=:9002"]
    networks:
      - edge

networks:
  edge:
    driver: bridge
