version: "3.9"

services:
  simple-http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT_SHA: ${COMMIT_SHA:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - TLS_CERT_PATH=/certs/tls.crt
      - TLS_KEY_PATH=/certs/tls.key
      - UPSTREAM_1=http://backend-1:9000
      - UPSTREAM_2=http://backend-2:9000
      - LB_STRATEGY=round_robin
    volumes:
      - ./configs:/app/configs:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "/app/simple-http-server", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge-net
    depends_on:
      - backend-1
      - backend-2

  backend-1:
    image: hashicorp/http-echo:1.0
    container_name: backend-1
    command: ["-text=response-from-backend-1", "-listen=:9000"]
    networks:
      - edge-net

  backend-2:
    image: hashicorp/http-echo:1.0
    container_name: backend-2
    command: ["-text=response-from-backend-2", "-listen=:9000"]
    networks:
      - edge-net

networks:
  edge-net:
    driver: bridge
