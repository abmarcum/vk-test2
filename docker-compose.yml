# Brings up the HTTP server plus two upstream backends to exercise the
# reverse-proxy and load-balancing features end to end.
# ============================================================================
version: "3.9"

services:
  simple-http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: "local"
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
      - "9090:9090"   # Metrics / health
    environment:
      HTTP_ADDR: ":8080"
      HTTPS_ADDR: ":8443"
      METRICS_ADDR: ":9090"
      CONFIG_PATH: "/etc/simple-http-server/config.yaml"
      TLS_CERT_PATH: "/etc/certs/tls.crt"
      TLS_KEY_PATH: "/etc/certs/tls.key"
      LOG_LEVEL: "info"
    volumes:
      - ./configs/config.yaml:/etc/simple-http-server/config.yaml:ro
      - ./certs:/etc/certs:ro
    healthcheck:
      test: ["CMD", "/app/simple-http-server", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started
    networks:
      - edge-net

  # Upstream target #1 for reverse-proxy / load-balancing tests
  backend-a:
    image: traefik/whoami:latest
    container_name: backend-a
    restart: unless-stopped
    environment:
      WHOAMI_NAME: "backend-a"
    networks:
      - edge-net

  # Upstream target #2 for reverse-proxy / load-balancing tests
  backend-b:
    image: traefik/whoami:latest
    container_name: backend-b
    restart: unless-stopped
    environment:
      WHOAMI_NAME: "backend-b"
    networks:
      - edge-net

networks:
  edge-net:
    driver: bridge
