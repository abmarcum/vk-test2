version: "3.9"

services:
  httpserver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "0.1.0"
        COMMIT_SHA: "local"
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS / SSL termination
    volumes:
      - ./configs/config.yaml:/etc/httpserver/config.yaml:ro
      - ./certs:/etc/httpserver/tls:ro
    environment:
      - LOG_LEVEL=info
      - LOAD_BALANCE_STRATEGY=round_robin
    healthcheck:
      test: ["CMD", "/app/httpserver", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - httpserver-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  backend-a:
    image: hashicorp/http-echo:1.0
    command: ["-text=backend-a", "-listen=:5678"]
    networks:
      - httpserver-net

  backend-b:
    image: hashicorp/http-echo:1.0
    command: ["-text=backend-b", "-listen=:5678"]
    networks:
      - httpserver-net

networks:
  httpserver-net:
    driver: bridge
