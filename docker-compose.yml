version: "3.9"

services:
  simple-http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: simple-http-server:${VERSION:-dev}
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "80:8080"    # HTTP / proxy entrypoint
      - "443:8443"   # HTTPS (TLS termination)
    environment:
      - SERVER_LOG_LEVEL=info
      - SERVER_TLS_CERT=/etc/certs/tls.crt
      - SERVER_TLS_KEY=/etc/certs/tls.key
      - SERVER_UPSTREAMS=backend-a:5678,backend-b:5678
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./certs:/etc/certs:ro
    depends_on:
      - backend-a
      - backend-b
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/app/simple-http-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  backend-a:
    image: hashicorp/http-echo:1.0
    container_name: backend-a
    command: ["-text=hello from backend-a", "-listen=:5678"]
    networks:
      - edge

  backend-b:
    image: hashicorp/http-echo:1.0
    container_name: backend-b
    command: ["-text=hello from backend-b", "-listen=:5678"]
    networks:
      - edge

networks:
  edge:
    driver: bridge
