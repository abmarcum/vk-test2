version: "3.9"
services:
  goproxy:
    build: .
    image: goproxy:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./config.yaml:/etc/goproxy/config.yaml:ro
      - ./certs:/etc/goproxy/certs:ro
    environment:
      - CONFIG_PATH=/etc/goproxy/config.yaml
    restart: unless-stopped
```

```bash
docker-compose up -d --build
docker-compose logs -f goproxy
```

### Kubernetes

**k8s/configmap.yaml**

```yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: goproxy-config
data:
  config.yaml: |
    server:
      http_addr: ":8080"
      https_addr: ":8443"
      enable_tls: true
      tls:
        cert_file: "/etc/goproxy/tls/tls.crt"
        key_file: "/etc/goproxy/tls/tls.key"
    routes:
      - match: "/"
        pool: "web_pool"
    pools:
      - name: "web_pool"
        strategy: "round_robin"
        backends:
          - url: "http://backend-svc:8000"
        health_check:
          enabled: true
          path: "/healthz"
```

**k8s/deployment.yaml**

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goproxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: goproxy
  template:
    metadata:
      labels:
        app: goproxy
    spec:
      containers:
        - name: goproxy
          image: goproxy:latest
          ports:
            - containerPort: 8080
            - containerPort: 8443
          env:
            - name: CONFIG_PATH
              value: /etc/goproxy/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/goproxy
            - name: tls
              mountPath: /etc/goproxy/tls
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: goproxy-config
        - name: tls
          secret:
            secretName: goproxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: goproxy
spec:
  selector:
    app: goproxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
  type: LoadBalancer
```

Deploy:

```bash
kubectl create secret tls goproxy-tls --cert=certs/server.crt --key=certs/server.key
kubectl apply -f k8s/configmap.yaml
kubectl apply -f k8s/deployment.yaml
kubectl get pods -l app=goproxy
```

