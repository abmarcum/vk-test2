version: "3.9"

services:
  http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: simple-http-server:${VERSION:-latest}
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP / proxy entrypoint
      - "8443:8443"   # HTTPS (TLS terminated here)
      - "9090:9090"   # Metrics (Prometheus)
    volumes:
      - ./configs/config.yaml:/app/config.yaml:ro
      - ./certs:/app/certs:ro
    environment:
      - LOG_LEVEL=info
      - TLS_CERT_FILE=/app/certs/server.crt
      - TLS_KEY_FILE=/app/certs/server.key
      - UPSTREAM_BACKENDS=backend-a:5678,backend-b:5678
      - LB_STRATEGY=round_robin
    depends_on:
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/app/http-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

  # --- Demo upstream backends for proxy / load-balancing testing ---
  backend-a:
    image: hashicorp/http-echo:latest
    container_name: backend-a
    command: ["-text=response from backend-a", "-listen=:5678"]
    networks:
      - edge

  backend-b:
    image: hashicorp/http-echo:latest
    container_name: backend-b
    command: ["-text=response from backend-b", "-listen=:5678"]
    networks:
      - edge

networks:
  edge:
    driver: bridge
