version: "3.9"

x-common-env: &common-env
  LOG_LEVEL: "info"
  HTTP_ADDR: ":8080"
  HTTPS_ADDR: ":8443"
  CONFIG_PATH: "/app/config/config.yaml"
  TLS_CERT_PATH: "/app/config/tls/tls.crt"
  TLS_KEY_PATH: "/app/config/tls/tls.key"

services:
  http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "local"
        COMMIT_SHA: "local"
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "8080:8080"   # HTTP / proxy entrypoint
      - "8443:8443"   # HTTPS (TLS termination in-app)
    volumes:
      - ./config:/app/config:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/app/http-server", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

  # Example upstream targets for proxy/load-balancing testing
  backend-a:
    image: hashicorp/http-echo:1.0
    command: ["-text=response-from-backend-a", "-listen=:5678"]
    container_name: backend-a
    networks:
      - edge

  backend-b:
    image: hashicorp/http-echo:1.0
    command: ["-text=response-from-backend-b", "-listen=:5678"]
    container_name: backend-b
    networks:
      - edge

networks:
  edge:
    driver: bridge
