version: "3.9"

services:
  http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "local"
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
    environment:
      - APP_ENV=local
      - HTTP_ADDR=:8080
      - HTTPS_ADDR=:8443
      - TLS_CERT_FILE=/certs/tls.crt
      - TLS_KEY_FILE=/certs/tls.key
      - UPSTREAM_URL=http://backend:80
      - LB_STRATEGY=round_robin
      - LOG_LEVEL=info
    volumes:
      - ./certs:/certs:ro
      - ./config/config.yaml:/app/config.yaml:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/simple-http-server", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # Sample upstream target to exercise proxy/load-balancing locally
  backend:
    image: kennethreitz/httpbin:latest
    container_name: sample-backend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/get"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - edge

networks:
  edge:
    driver: bridge
