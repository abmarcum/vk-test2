version: "3.9"

x-common-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  simple-http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: simple-http-server
        VERSION: local
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./certs:/app/certs:ro
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
      - TLS_CERT_FILE=/app/certs/server.crt
      - TLS_KEY_FILE=/app/certs/server.key
      - UPSTREAM_BACKENDS=backend-1:8081,backend-2:8081
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  backend-1:
    image: hashicorp/http-echo:1.0.0
    container_name: backend-1
    command: ["-text=hello from backend-1", "-listen=:8081"]
    networks:
      - edge
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend-2:
    image: hashicorp/http-echo:1.0.0
    container_name: backend-2
    command: ["-text=hello from backend-2", "-listen=:8081"]
    networks:
      - edge
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  edge:
    driver: bridge
