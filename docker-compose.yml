version: "3.9"

services:
  http-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
      - TLS_CERT_PATH=/etc/certs/tls.crt
      - TLS_KEY_PATH=/etc/certs/tls.key
      - PROXY_UPSTREAMS=backend-a:9001,backend-b:9002
      - LB_STRATEGY=round_robin
    volumes:
      - ./config:/app/config:ro
      - ./certs:/etc/certs:ro
    networks:
      - httpnet
    depends_on:
      - backend-a
      - backend-b
    healthcheck:
      test: ["CMD", "/app/simple-http-server", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend-a:
    image: hashicorp/http-echo:1.0
    command: ["-text=response from backend-a", "-listen=:9001"]
    container_name: backend-a
    networks:
      - httpnet

  backend-b:
    image: hashicorp/http-echo:1.0
    command: ["-text=response from backend-b", "-listen=:9002"]
    container_name: backend-b
    networks:
      - httpnet

networks:
  httpnet:
    driver: bridge
```

---
