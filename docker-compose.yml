## Operational Endpoints

| Endpoint | Description |
|---|---|
| `GET /healthz` | Liveness endpoint — `200 ok` if at least one backend across all pools is alive (or no pools configured); otherwise `503`. |
| `GET /metrics` | Plain-text metrics exposition (request counters, gauges). See [API Docs](docs/api.md). |
| `* /...` (any other path) | Proxied to the matching pool's backend per the configured load-balancing strategy. |

Full endpoint/response semantics are documented in [docs/api.md](docs/api.md).

