version: "3.9"

x-common-env: &common-env
  LOG_LEVEL: "info"
  LB_STRATEGY: "round_robin"          # round_robin | least_conn | ip_hash
  TLS_CERT_FILE: "/certs/server.crt"
  TLS_KEY_FILE: "/certs/server.key"
  UPSTREAMS: "http://backend-1:80,http://backend-2:80"

services:
  http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "local-dev"
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP / proxy / LB entrypoint
      - "8443:8443"   # HTTPS (SSL termination)
    environment:
      <<: *common-env
    volumes:
      - ./certs:/certs:ro
      - ./config:/app/config:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - edge-net
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # --- Sample upstream backends to exercise proxy / load-balancing locally ---
  backend-1:
    image: traefik/whoami:latest
    container_name: backend-1
    restart: unless-stopped
    networks:
      - edge-net

  backend-2:
    image: traefik/whoami:latest
    container_name: backend-2
    restart: unless-stopped
    networks:
      - edge-net

networks:
  edge-net:
    driver: bridge
