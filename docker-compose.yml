# Spins up the HTTP server plus two upstream backends to exercise
# proxying + load-balancing, and a self-signed TLS cert generator.
# =============================================================================
version: "3.9"

services:
  simple-http-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local-dev
    image: simple-http-server:local
    container_name: simple-http-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
    environment:
      - LOG_LEVEL=debug
      - LB_STRATEGY=round_robin
      - UPSTREAMS=http://backend-a:80,http://backend-b:80
      - TLS_CERT_FILE=/etc/simple-http-server/tls/server.crt
      - TLS_KEY_FILE=/etc/simple-http-server/tls/server.key
    volumes:
      - ./config/config.yaml:/etc/simple-http-server/config.yaml:ro
      - ./certs:/etc/simple-http-server/tls:ro
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend-a:
    image: hashicorp/http-echo:latest
    container_name: backend-a
    command: ["-text=response from backend-a", "-listen=:80"]
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend-b:
    image: hashicorp/http-echo:latest
    container_name: backend-b
    command: ["-text=response from backend-b", "-listen=:80"]
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  edge:
    driver: bridge
